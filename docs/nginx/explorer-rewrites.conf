# Explorer rewrite rules (bare canonical URLs; legacy /explorer/* paths redirect)
#
# Usage:
#   include /var/www/html/siagraph-web-codex/docs/nginx/explorer-rewrites.conf;
#
# Place this include inside the relevant `server { ... }` block, before
# generic PHP handling.

# -----------------------------------------------------------------------------
# Extensionless PHP retries (restores behavior previously provided by
# @extensionless-php while keeping explicit explorer rewrites authoritative)
# -----------------------------------------------------------------------------

# API extensionless fallback, e.g. /api/v1/hosts -> /api/v1/hosts.php
location /api/ {
    try_files $uri $uri/ @api_extensionless_php;
}

location @api_extensionless_php {
    rewrite ^(/api/.+)$ $1.php last;
}

# Generic extensionless fallback for non-file/non-dir requests.
# Keep this after explicit route rewrites in matching priority.
location / {
    try_files $uri $uri/ @site_extensionless_php;
}

location @site_extensionless_php {
    rewrite ^/(.*)$ /$1.php last;
}

# -----------------------------------------------------------------------------
# Explorer hub page (unchanged; entity/tool routes below no longer carry the
# /explorer prefix, but the landing page itself still lives at /explorer)
# -----------------------------------------------------------------------------

location = /explorer {
    rewrite ^ /explorer/ last;
}

# -----------------------------------------------------------------------------
# Canonical bare routes for CURRENT/EXISTING explorer entity & tool pages
# (every page is a flat file directly under explorer/, e.g. explorer/address.php;
# explorer/_page.php is the shared shell they all require)
# -----------------------------------------------------------------------------

location ~ ^/address/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/address/index.php?id=$1 last;
}

location ~ ^/tx/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/tx/index.php?id=$1 last;
}

location ~ ^/block/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/block/index.php?id=$1 last;
}

location ~ ^/contract/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/contract/index.php?id=$1 last;
}

# Output supports both explicit type and id-only forms.
location ~ ^/output/(siacoin|siafund)/([^/?#]+)$ {
    rewrite ^ /explorer/output/index.php?type=$1&id=$2 last;
}

location ~ ^/output/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/output/index.php?id=$1 last;
}

location ~ ^/search/(?!index\.php$)(.+)$ {
    rewrite ^ /explorer/search/index.php?id=$1 last;
}

location = /search {
    if ($arg_id != "") { return 301 /search/$arg_id; }
    rewrite ^ /explorer/search/index.php last;
}

location = /block-metrics {
    rewrite ^ /explorer/block-metrics/index.php last;
}

location ~ ^/height/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/height/index.php?height=$1 last;
}

location ~ ^/v2-tx/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/v2-tx/index.php?id=$1 last;
}

location ~ ^/v2-contract/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/v2-contract/index.php?id=$1 last;
}

location ~ ^/event/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/event/index.php?id=$1 last;
}

location ~ ^/transaction/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/transaction/index.php?id=$1 last;
}

# Already canonical without a prefix.
location = /txpool {
    rewrite ^ /explorer/txpool/index.php last;
}

location = /consensus {
    rewrite ^ /explorer/consensus/index.php last;
}

location = /metrics {
    rewrite ^ /explorer/metrics/index.php last;
}

location ~ ^/exchange/(?!index\.php$)([^/?#]+)$ {
    rewrite ^ /explorer/exchange/index.php?currency=$1 last;
}

# NOT de-prefixed: the site already serves an unrelated dashboard peers page
# (network/peers.php, see dashboard-rewrites.conf) at the bare /peers path,
# so the explorer's raw consensus-peers page keeps its /explorer/peers URL
# until that name collision is resolved.
location = /explorer/peers {
    rewrite ^ /explorer/peers.php last;
}

# -----------------------------------------------------------------------------
# Backward compatibility for the previous /explorer/* URL shape
# (redirect old prefixed path -> new canonical bare path, preserving any
# query string)
# -----------------------------------------------------------------------------

location ~ ^/explorer/address/(?!index\.php$)([^/?#]+)$ {
    return 301 /address/$1$is_args$args;
}

location ~ ^/explorer/tx/(?!index\.php$)([^/?#]+)$ {
    return 301 /tx/$1$is_args$args;
}

location ~ ^/explorer/block/(?!index\.php$)([^/?#]+)$ {
    return 301 /block/$1$is_args$args;
}

location ~ ^/explorer/contract/(?!index\.php$)([^/?#]+)$ {
    return 301 /contract/$1$is_args$args;
}

location ~ ^/explorer/output/(siacoin|siafund)/([^/?#]+)$ {
    return 301 /output/$1/$2$is_args$args;
}

location ~ ^/explorer/output/(?!index\.php$)([^/?#]+)$ {
    return 301 /output/$1$is_args$args;
}

location ~ ^/explorer/search/(?!index\.php$)(.+)$ {
    return 301 /search/$1$is_args$args;
}

location = /explorer/search {
    return 301 /search$is_args$args;
}

location = /explorer/block-metrics {
    return 301 /block-metrics$is_args$args;
}

location ~ ^/explorer/height/(?!index\.php$)([^/?#]+)$ {
    return 301 /height/$1$is_args$args;
}

location ~ ^/explorer/v2-tx/(?!index\.php$)([^/?#]+)$ {
    return 301 /v2-tx/$1$is_args$args;
}

location ~ ^/explorer/v2-contract/(?!index\.php$)([^/?#]+)$ {
    return 301 /v2-contract/$1$is_args$args;
}

location ~ ^/explorer/event/(?!index\.php$)([^/?#]+)$ {
    return 301 /event/$1$is_args$args;
}

location ~ ^/explorer/transaction/(?!index\.php$)([^/?#]+)$ {
    return 301 /transaction/$1$is_args$args;
}

# Backward compatibility for the previous explorer-prefixed txpool URL.
location = /explorer/txpool {
    return 301 /txpool;
}

location = /explorer/consensus {
    return 301 /consensus$is_args$args;
}

location = /explorer/metrics {
    return 301 /metrics$is_args$args;
}

location ~ ^/explorer/exchange/(?!index\.php$)([^/?#]+)$ {
    return 301 /exchange/$1$is_args$args;
}

# Query-style compatibility (old ?id=-style explorer URLs -> new canonical bare path)
location = /explorer/address {
    if ($arg_id != "") { return 301 /address/$arg_id; }
    rewrite ^ /explorer/address/index.php last;
}

location = /explorer/tx {
    if ($arg_id != "") { return 301 /tx/$arg_id; }
    rewrite ^ /explorer/tx/index.php last;
}

location = /explorer/block {
    if ($arg_id != "") { return 301 /block/$arg_id; }
    rewrite ^ /explorer/block/index.php last;
}

location = /explorer/contract {
    if ($arg_id != "") { return 301 /contract/$arg_id; }
    rewrite ^ /explorer/contract/index.php last;
}

location = /explorer/output {
    if ($arg_type != "") { return 301 /output/$arg_type/$arg_id; }
    if ($arg_id != "") { return 301 /output/$arg_id; }
    rewrite ^ /explorer/output/index.php last;
}

location = /explorer/height {
    if ($arg_height != "") { return 301 /height/$arg_height; }
    rewrite ^ /explorer/height/index.php last;
}

location = /explorer/v2/tx {
    if ($arg_id != "") { return 301 /v2-tx/$arg_id; }

# Dashboard page rewrites
#
# Usage:
#   include /var/www/html/siagraph-web-codex/docs/nginx/dashboard-rewrites.conf;
#
# Place this include inside the relevant `server { ... }` block, before
# generic PHP handling (alongside explorer-rewrites.conf).
#
# These dashboard pages were moved into topic folders (host/, network/,
# renter/, contracts/, economics/) purely for file organisation. Their public
# URLs are unchanged - each rule below just points the existing bare URL at
# the page's new file location. Query strings pass through untouched.

location = /host {
    rewrite ^ /host/host.php last;
}

location = /host_alerts {
    rewrite ^ /host/host_alerts.php last;
}

